<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6f48dc" />
<title>My Words</title>
<style>
:root{
  --bg:#f7f6fb; --card:#ffffff; --ink:#1f2454; --muted:#75799a; --purple:#6f48dc; --purple2:#8d67ee;
  --line:#e9e6f2; --gold:#ffbf19; --shadow:0 16px 40px rgba(45,30,110,.10); --soft:#f2edff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fbfaff 0%,#f6f4fb 100%);color:var(--ink)}
button,input{font:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding:20px 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:12px}.owl{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#6d46d9,#8b68ef);display:grid;place-items:center;box-shadow:var(--shadow);font-size:38px}.brand h1{margin:0;font-size:40px;letter-spacing:-1px}.brand p{margin:3px 0 0;color:var(--muted)}
.iconbtn{border:0;background:var(--card);width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer}
.hero{background:var(--card);border:1px solid rgba(110,72,220,.08);border-radius:32px;padding:28px;box-shadow:var(--shadow);text-align:center}
.micwrap{display:grid;place-items:center;margin:8px auto 12px}.mic{width:158px;height:158px;border-radius:50%;border:10px solid #eee9ff;background:linear-gradient(145deg,var(--purple2),var(--purple));box-shadow:0 15px 28px rgba(89,58,190,.28);color:#fff;font-size:62px;cursor:pointer;transition:.2s}.mic.listening{transform:scale(1.04);box-shadow:0 0 0 16px rgba(111,72,220,.10),0 18px 36px rgba(89,58,190,.35)}
.say{font-size:28px;font-weight:900;color:var(--purple);letter-spacing:.5px}.hint{color:var(--muted);font-size:14px;margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--muted)}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.lookup{display:flex;gap:10px}.lookup input{flex:1;border:2px solid #bba9f4;border-radius:18px;padding:15px 16px;outline:none;background:#fff}.lookup button{border:0;border-radius:18px;padding:0 20px;color:white;font-weight:800;background:linear-gradient(145deg,var(--purple2),var(--purple));box-shadow:0 10px 20px rgba(89,58,190,.18);cursor:pointer}
.status{min-height:24px;color:var(--purple);font-weight:700;margin-top:12px}
.result{display:none;text-align:left;margin-top:20px;padding:22px;border-radius:24px;background:#fbfaff;border:1px solid var(--line)}.result.show{display:block}.wordline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.wordtitle{font-size:34px;font-weight:900;margin:0}.meta{color:var(--purple);font-weight:700;margin-top:4px}.simple{font-size:18px;line-height:1.5;margin:14px 0}.examples{margin:14px 0 0;padding-left:22px;color:#444a70}.examples li{margin:10px 0;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid #d9d0f7;background:white;color:var(--ink);border-radius:999px;padding:10px 14px;cursor:pointer}.pill.primary{background:var(--purple);color:white;border-color:var(--purple)}
.section{margin-top:28px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{margin:0;font-size:26px}.sectionhead button{border:0;background:none;color:var(--purple);font-weight:700;cursor:pointer}
.list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(45,30,110,.06);display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.tile{width:54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px}.item h3{margin:0 0 4px;font-size:22px}.item p{margin:0;color:var(--muted)}.star{border:0;background:none;font-size:30px;cursor:pointer;color:#9a9db4}.star.on{color:var(--gold)}
.empty{padding:22px;background:#fff;border:1px dashed #cfc7eb;border-radius:20px;color:var(--muted);text-align:center}
.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(728px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(45,30,110,.15);display:grid;grid-template-columns:repeat(4,1fr);padding:8px;z-index:10}.navbtn{border:0;background:transparent;border-radius:16px;padding:10px 6px;color:#696d8e;cursor:pointer}.navbtn.active{background:var(--soft);color:var(--purple);font-weight:800}.navbtn span{display:block;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(25,20,55,.38);display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.sheet{width:min(560px,100%);max-height:80vh;overflow:auto;background:white;border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.sheet h2{margin-top:0}.close{float:right;border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;cursor:pointer}
.small{font-size:13px;color:var(--muted)}
@media (max-width:560px){.app{padding:14px 12px 100px}.brand h1{font-size:32px}.brand p{font-size:13px}.owl{width:54px;height:54px;font-size:32px}.hero{padding:22px 16px;border-radius:26px}.mic{width:140px;height:140px}.lookup{flex-direction:column}.lookup button{padding:14px}.wordtitle{font-size:30px}.item{grid-template-columns:48px 1fr auto}.tile{width:48px;height:48px}.item h3{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="owl" aria-label="cartoon owl icon">🦉</div>
      <div><h1>My Words</h1><p>Build your vocabulary while you read.</p></div>
    </div>
    <button class="iconbtn" id="clearBtn" title="Clear saved words">⚙️</button>
  </div>

  <section class="hero">
    <div class="micwrap"><button class="mic" id="micBtn" aria-label="Say a word">🎙️</button></div>
    <div class="say">SAY A WORD</div>
    <div class="hint">Tap the microphone and say any word you don't know.</div>
    <div class="divider">or type it</div>
    <div class="lookup">
      <input id="wordInput" autocomplete="off" autocapitalize="none" placeholder="Type a word..." />
      <button id="lookupBtn">LOOK UP</button>
    </div>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="wordline"><div><h2 class="wordtitle" id="resWord"></h2><div class="meta" id="resMeta"></div></div><button class="star" id="resStar" title="Favorite">☆</button></div>
      <div class="simple" id="resDefinition"></div>
      <ul class="examples" id="resExamples"></ul>
      <div class="actions">
        <button class="pill" id="speakBtn">🔊 Hear it</button>
        <button class="pill primary" id="saveBtn">＋ Save word</button>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="sectionhead"><h2>🕘 Recently Learned</h2><button id="viewAllBtn">View all</button></div>
    <div class="list" id="recentList"></div>
  </section>
</div>

<nav class="bottom">
  <button class="navbtn active" data-view="home"><span>🏠</span>Home</button>
  <button class="navbtn" data-view="words"><span>📖</span>My Words</button>
  <button class="navbtn" data-view="favorites"><span>⭐</span>Favorites</button>
  <button class="navbtn" data-view="quiz"><span>🎓</span>Quiz Me</button>
</nav>

<div class="modal" id="modal"><div class="sheet"><button class="close" id="closeModal">✕</button><div id="modalContent"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const storeKey='myWords.v1';
let words=JSON.parse(localStorage.getItem(storeKey)||'[]');
let current=null;

const fallback = {
  obsequious:{partOfSpeech:'adjective',phonetic:'uhb-SEE-kwee-us',definition:'Excessively eager to please or obey someone, especially in a way that seems insincere.',examples:['His obsequious behavior toward his boss annoyed his coworkers.','The waiter was polite without being obsequious.','She distrusted the politician’s obsequious praise of the wealthy donor.']},
  perfunctory:{partOfSpeech:'adjective',phonetic:'per-FUNK-tuh-ree',definition:'Done with little care, effort, or interest.',examples:['He gave the room a perfunctory glance before leaving.','Her apology sounded perfunctory rather than sincere.','The inspection was so perfunctory that several problems were missed.']},
  incredulous:{partOfSpeech:'adjective',phonetic:'in-KREJ-uh-lus',definition:'Unwilling or unable to believe something.',examples:['She gave him an incredulous look.','The audience was incredulous when the result was announced.','He sounded incredulous at the suggestion that he had forgotten.']}
};

function saveStore(){localStorage.setItem(storeKey,JSON.stringify(words));renderRecent();}
function normalize(w){return w.trim().toLowerCase().replace(/[^a-z'-]/g,'');}
function title(w){return w ? w.charAt(0).toUpperCase()+w.slice(1) : ''}
function setStatus(t){$('#status').textContent=t||''}

async function lookupWord(raw){
  const word=normalize(raw); if(!word) return;
  $('#wordInput').value=word; setStatus('Looking it up…'); $('#result').classList.remove('show');
  let entry=null;
  try{
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(r.ok){
      const data=await r.json(); const d=data?.[0]; const m=d?.meanings?.[0]; const def=m?.definitions?.[0];
      if(def?.definition){entry={word,partOfSpeech:m.partOfSpeech||'',phonetic:d.phonetic||d.phonetics?.find(p=>p.text)?.text||'',definition:def.definition,examples:[def.example,...(m.definitions||[]).map(x=>x.example)].filter(Boolean).slice(0,3)};}
    }
  }catch(e){}
  if(!entry && fallback[word]) entry={word,...fallback[word]};
  if(!entry){setStatus('I couldn’t find that word. Check the spelling and try again.');return;}
  if(entry.examples.length<3){
    const base=entry.definition.replace(/[.;]$/,'');
    const generic=[`The author used “${word}” in a way that matched this meaning: ${base}.`,`After learning “${word},” I noticed it more often while reading.`,`Using “${word}” in a sentence can help make the meaning stick.`];
    entry.examples=[...entry.examples,...generic].slice(0,3);
  }
  current=entry; setStatus(''); showResult(entry);
}

function showResult(e){
  $('#resWord').textContent=title(e.word); $('#resMeta').textContent=[e.partOfSpeech,e.phonetic].filter(Boolean).join(' · ');
  $('#resDefinition').textContent=e.definition; $('#resExamples').innerHTML=e.examples.map(x=>`<li>${escapeHtml(x)}</li>`).join('');
  const saved=words.find(x=>x.word===e.word); $('#resStar').textContent=saved?.favorite?'★':'☆'; $('#resStar').classList.toggle('on',!!saved?.favorite);
  $('#saveBtn').textContent=saved?'✓ Saved':'＋ Save word'; $('#result').classList.add('show');
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function saveCurrent(){if(!current)return; const old=words.find(x=>x.word===current.word); if(!old) words.unshift({...current,favorite:false,added:Date.now()}); saveStore(); showResult(current);}
function toggleFavorite(word){const x=words.find(w=>w.word===word); if(x){x.favorite=!x.favorite;saveStore(); if(current?.word===word)showResult(current);}}
function renderRecent(list=words.slice(0,6)){
  const el=$('#recentList'); if(!list.length){el.innerHTML='<div class="empty">Your saved words will appear here.</div>';return;}
  el.innerHTML=list.map((w,i)=>`<div class="item" data-word="${escapeHtml(w.word)}"><div class="tile">${['📚','📝','💡','🔤'][i%4]}</div><div><h3>${escapeHtml(title(w.word))}</h3><p>${escapeHtml(w.definition)}</p></div><button class="star ${w.favorite?'on':''}" data-star="${escapeHtml(w.word)}">${w.favorite?'★':'☆'}</button></div>`).join('');
}

$('#lookupBtn').onclick=()=>lookupWord($('#wordInput').value);
$('#wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')lookupWord(e.target.value)});
$('#saveBtn').onclick=saveCurrent;
$('#resStar').onclick=()=>{if(!current)return; saveCurrent(); toggleFavorite(current.word)};
$('#speakBtn').onclick=()=>{if(current && 'speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(current.word));}};
$('#recentList').onclick=e=>{const star=e.target.closest('[data-star]'); if(star){e.stopPropagation();toggleFavorite(star.dataset.star);return;} const item=e.target.closest('[data-word]'); if(item){const w=words.find(x=>x.word===item.dataset.word); if(w){current=w;showResult(w);window.scrollTo({top:0,behavior:'smooth'})}}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=3;
  $('#micBtn').onclick=()=>{setStatus('Listening…');$('#micBtn').classList.add('listening');try{rec.start()}catch(e){}};
  rec.onresult=e=>{const heard=e.results[0][0].transcript.trim().split(/\s+/)[0]; setStatus(`I heard: “${heard}”`); $('#wordInput').value=heard; setTimeout(()=>lookupWord(heard),350)};
  rec.onerror=()=>setStatus('I couldn’t hear that clearly. Try again or type the word.');
  rec.onend=()=>$('#micBtn').classList.remove('listening');
}else{$('#micBtn').onclick=()=>setStatus('Voice entry is not supported by this browser. You can still type the word below.');}

function openModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('show')}
$('#closeModal').onclick=()=>$('#modal').classList.remove('show'); $('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
$('#viewAllBtn').onclick=()=>showWords('All Saved Words',words);
function showWords(titleText,list){openModal(`<h2>${titleText}</h2>${list.length?list.map(w=>`<div class="item" style="margin:10px 0"><div class="tile">📘</div><div><h3>${escapeHtml(title(w.word))}</h3><p>${escapeHtml(w.definition)}</p></div><button class="star ${w.favorite?'on':''}">${w.favorite?'★':'☆'}</button></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}`)}

$('.bottom').onclick=e=>{const b=e.target.closest('.navbtn');if(!b)return; document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  if(b.dataset.view==='home'){window.scrollTo({top:0,behavior:'smooth'});return;}
  if(b.dataset.view==='words')showWords('My Words',words);
  if(b.dataset.view==='favorites')showWords('Favorites',words.filter(w=>w.favorite));
  if(b.dataset.view==='quiz')startQuiz();
};
function startQuiz(){
  if(words.length<2){openModal('<h2>Quiz Me</h2><div class="empty">Save at least 2 words first, then I can quiz you.</div>');return;}
  const correct=words[Math.floor(Math.random()*words.length)]; const options=[correct,...words.filter(w=>w.word!==correct.word).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  openModal(`<h2>Quiz Me</h2><p>Which word means:</p><p style="font-size:20px;font-weight:800">${escapeHtml(correct.definition)}</p><div class="actions">${options.map(o=>`<button class="pill quizOption" data-answer="${escapeHtml(o.word)}" data-correct="${escapeHtml(correct.word)}">${escapeHtml(title(o.word))}</button>`).join('')}</div><div id="quizFeedback" class="status"></div>`);
  document.querySelectorAll('.quizOption').forEach(btn=>btn.onclick=()=>{$('#quizFeedback').textContent=btn.dataset.answer===btn.dataset.correct?'✅ Correct!':`Not quite — the answer is ${title(btn.dataset.correct)}.`;});
}
$('#clearBtn').onclick=()=>openModal(`<h2>Settings</h2><p class="small">Your saved words live only in this browser using local storage.</p><button class="pill" id="clearAll">Clear all saved words</button>`);
document.addEventListener('click',e=>{if(e.target?.id==='clearAll'){if(confirm('Clear all saved words?')){words=[];saveStore();$('#modal').classList.remove('show');$('#result').classList.remove('show')}}});

renderRecent();
</script>
</body>
</html>
