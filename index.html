<script>
const $=s=>document.querySelector(s);
const storeKey='myWords.v1';
let words=JSON.parse(localStorage.getItem(storeKey)||'[]');
let current=null;

const fallback = {
  obsequious:{partOfSpeech:'adjective',phonetic:'uhb-SEE-kwee-us',definition:'Excessively eager to please or obey someone, especially in a way that seems insincere.',examples:['His obsequious behavior toward his boss annoyed his coworkers.','The waiter was polite without being obsequious.','She distrusted the politician’s obsequious praise of the wealthy donor.']},
  perfunctory:{partOfSpeech:'adjective',phonetic:'per-FUNK-tuh-ree',definition:'Done with little care, effort, or interest.',examples:['He gave the room a perfunctory glance before leaving.','Her apology sounded perfunctory rather than sincere.','The inspection was so perfunctory that several problems were missed.']},
  incredulous:{partOfSpeech:'adjective',phonetic:'in-KREJ-uh-lus',definition:'Unwilling or unable to believe something.',examples:['She gave him an incredulous look.','The audience was incredulous when the result was announced.','He sounded incredulous at the suggestion that he had forgotten.']},
  sinuous:{partOfSpeech:'adjective',phonetic:'SIN-yoo-us',definition:'Having many curves and turns; winding or flowing in a graceful, smooth way.',examples:['A sinuous path wound through the forest.','The river followed a sinuous course through the valley.','The dancer moved with a slow, sinuous grace.']}
};

function saveStore(){localStorage.setItem(storeKey,JSON.stringify(words));renderRecent();}
function normalize(w){return w.trim().toLowerCase().replace(/[^a-z'-]/g,'');}
function title(w){return w ? w.charAt(0).toUpperCase()+w.slice(1) : ''}
function setStatus(t){$('#status').textContent=t||''}


function cleanDefinition(text){
  let s=stripHtml(String(text||'')).trim();
  s=s.replace(/\.mw-parser-output\b[\s\S]*$/i,'');
  s=s.replace(/\{[^{}]*(?:font-size|display|margin|padding|color|background|border)[^{}]*\}/gi,'');
  s=s.replace(/\b(?:mw-parser-output|defdate|font-size|smaller)\b/gi,'');
  s=s.replace(/\s*\[[0-9]+\]\s*/g,' ');
  s=s.replace(/^\s*\((?:countable|uncountable|countable and uncountable|transitive|intransitive|ambitransitive|ditransitive|chiefly|usually|often|sometimes|rare|rarely|archaic|obsolete|dated|informal|formal|slang|colloquial|literary|figurative|historical|technical|biology|botany|zoology|grammar|linguistics)(?:[^)]*)\)\s*/i,'');
  s=s.replace(/^\s*(?:countable|uncountable|transitive|intransitive|chiefly|usually|often|sometimes|rare|archaic|obsolete|dated|informal|formal|slang|colloquial|literary|figurative)\s*[:;,.-]\s*/i,'');
  s=s.replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim();
  return s;
}

function stripHtml(text){
  const div=document.createElement('div');
  div.innerHTML=String(text||'');
  div.querySelectorAll('style,script,noscript,template,link,meta,sup.reference').forEach(n=>n.remove());
  return (div.textContent||div.innerText||'').replace(/\s+/g,' ').trim();
}

function usefulExample(text,word){
  const s=stripHtml(text).replace(/^\s*[•*#:-]+\s*/,'').trim();
  if(!s || s.length<8 || s.length>220) return '';
  // Prefer examples that actually contain the looked-up word (or an obvious inflection).
  const stem=word.replace(/e$/,'');
  const rx=new RegExp(`\\b${stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\w*\\b`,'i');
  return rx.test(s)?s:'';
}

function looksLikeBadOldExample(text,word){
  const s=String(text||'').toLowerCase();
  const w=String(word||'').toLowerCase();
  return (
    !s ||
    s.includes(`began to ${w}`) ||
    s.includes(`tried to ${w}`) ||
    s.includes(`watched him ${w}`) ||
    s.includes(`after learning “${w}`) ||
    s.includes(`using “${w}” in a sentence`) ||
    s.includes(`the author used “${w}`) ||
    s.includes('showing no verified examples')
  );
}

function repairExamples(entry){
  if(!entry) return entry;
  const word=entry.word;
  const cleaned=(Array.isArray(entry.examples)?entry.examples:[])
    .map(x=>usefulExample(x,word))
    .filter(x=>x && !looksLikeBadOldExample(x,word));

  const local=smartLocalExamples(word,entry.partOfSpeech,entry.definition);
  entry.examples=[...new Set([...cleaned,...local])].slice(0,3);
  return entry;
}


async function fetchWiktionaryEntry(word){
  try{
    const r=await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word)}`);
    if(!r.ok) return null;
    const data=await r.json();
    const groups=Array.isArray(data?.en)?data.en:[];
    for(const group of groups){
      const pos=group?.partOfSpeech||group?.part_of_speech||group?.partofspeech||'';
      const defs=Array.isArray(group?.definitions)?group.definitions:[];
      for(const d of defs){
        const rawDef=typeof d==='string'?d:(d?.definition||d?.text||'');
        const def=cleanDefinition(stripHtml(rawDef));
        if(!def) continue;
        let examples=[];
        const ex=d?.examples||d?.example||group?.examples||[];
        const arr=Array.isArray(ex)?ex:[ex];
        examples=arr.map(x=>typeof x==='string'?x:(x?.text||x?.example||''))
          .map(x=>usefulExample(x,word)).filter(Boolean);
        return {word,partOfSpeech:pos,phonetic:'',definition:def,examples:[...new Set(examples)].slice(0,3)};
      }
    }
  }catch(e){}
  return null;
}

async function fetchTatoebaExamples(word){
  try{
    const url=`https://api.tatoeba.org/v1/sentences?lang=eng&q=${encodeURIComponent(word)}&limit=20`;
    const r=await fetch(url);
    if(!r.ok) return [];
    const data=await r.json();
    const rows=Array.isArray(data)?data:(data?.data||data?.results||data?.sentences||[]);
    const stem=word.replace(/e$/,'');
    const rx=new RegExp(`\\b${stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\w*\\b`,'i');
    const out=[];
    for(const row of rows){
      const text=String(row?.text||row?.sentence||row?.content||'').replace(/\s+/g,' ').trim();
      if(!text || text.length<12 || text.length>180 || !rx.test(text)) continue;
      if(!/[.!?]$/.test(text)) continue;
      if(!out.some(x=>x.toLowerCase()===text.toLowerCase())) out.push(text);
      if(out.length>=3) break;
    }
    return out;
  }catch(e){ return []; }
}



const qualityOverrides={
  pendant:{partOfSpeech:'noun',definition:'A piece of jewelry that hangs from a necklace, chain, or cord.',examples:[
    'She wore a silver pendant on a delicate chain around her neck.',
    'The pendant caught the light as she turned toward the window.',
    'He gave her a small pendant engraved with her initials.'
  ]},
  parasol:{partOfSpeech:'noun',definition:'A light umbrella used for shade and protection from the sun.',examples:[
    'She opened her parasol before stepping into the bright afternoon sun.',
    'A striped parasol shaded the small table on the terrace.',
    'The woman carried a lace parasol as she walked through the garden.'
  ]},
  dell:{partOfSpeech:'noun',definition:'A small, secluded valley or hollow, often wooded.',examples:[
    'A narrow stream wound through the quiet dell below the hill.',
    'Wildflowers covered the floor of the wooded dell.',
    'They stopped for lunch in a shaded dell beside the trail.'
  ]},
  sinuous:{partOfSpeech:'adjective',definition:'Having many curves and turns; winding or flowing in a graceful way.',examples:[
    'The river followed a sinuous path through the valley.',
    'A sinuous road climbed the mountainside in a series of tight curves.',
    'The dancer moved with a slow, sinuous grace.'
  ]}
};

function pickBestDictionarySense(data,word){
  const d=data?.[0];
  if(!d) return null;
  const candidates=[];
  for(const meaning of (d.meanings||[])){
    for(const def of (meaning.definitions||[])){
      if(!def?.definition) continue;
      const raw=String(def.definition);
      const clean=cleanDefinition(raw);
      if(!clean) continue;
      let score=0;
      if(def.example) score+=4;
      if(clean.length>=25 && clean.length<=150) score+=2;
      if(/\b(common|usually|typically)\b/i.test(raw)) score+=1;
      if(/\b(rafter|heraldry|taxonomy|anatomy|botany|zoology|obsolete|archaic|dialect|technical)\b/i.test(raw)) score-=4;
      if(/\([A-Z][a-z]+\s+[a-z]+\)/.test(raw)) score-=2;
      if(clean.length>220) score-=2;
      candidates.push({score,meaning,def,clean});
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0];
  if(!best) return null;
  const examples=[best.def.example,...(best.meaning.definitions||[]).map(x=>x.example)].filter(Boolean).slice(0,3);
  return {word,partOfSpeech:best.meaning.partOfSpeech||'',phonetic:d.phonetic||d.phonetics?.find(p=>p.text)?.text||'',definition:best.clean,examples};
}

async function fetchWiktionaryPageExamples(word){
  try{
    const url=`https://en.wiktionary.org/w/api.php?action=parse&page=${encodeURIComponent(word)}&prop=text&format=json&origin=*`;
    const r=await fetch(url);
    if(!r.ok) return [];
    const data=await r.json();
    const raw=data?.parse?.text?.['*']||'';
    if(!raw) return [];
    const doc=new DOMParser().parseFromString(raw,'text/html');
    doc.querySelectorAll('style,script,table,.NavFrame,.mw-editsection,.reference').forEach(n=>n.remove());
    const stem=word.replace(/e$/,'');
    const rx=new RegExp(`\\b${stem.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')}\\w*\\b`,'i');
    const out=[];
    const nodes=[...doc.querySelectorAll('dd,li,.h-usage-example,.usage-example,.e-example')];
    for(const n of nodes){
      let s=(n.textContent||'').replace(/\\s+/g,' ').trim();
      s=s.replace(/^quotations?\s*:?/i,'').trim();
      if(!s || s.length<18 || s.length>190 || !rx.test(s)) continue;
      if(!/[.!?]$/.test(s)) continue;
      if(/^(Synonyms|Antonyms|Derived terms|Related terms|Translations|Coordinate terms)/i.test(s)) continue;
      if(!out.some(x=>x.toLowerCase()===s.toLowerCase())) out.push(s);
      if(out.length>=3) break;
    }
    return out;
  }catch(e){ return []; }
}

function smartLocalExamples(word,pos,definition){
  const d=String(definition||'').toLowerCase();
  const p=String(pos||'').toLowerCase();
  if(qualityOverrides[word]) return qualityOverrides[word].examples;

  // A few semantic cues make the local examples feel specific rather than generic.
  if(p.includes('noun')){
    if(/valley|hollow|wooded|land|ground|ravine|glen|dale/.test(d)) return [
      `A narrow trail descended into the ${word}.`,
      `Morning mist settled quietly over the ${word}.`,
      `Wildflowers grew along the floor of the ${word}.`
    ];
    if(/umbrella|sun|shade|canopy/.test(d)) return [
      `She opened the ${word} to shield herself from the afternoon sun.`,
      `A bright ${word} shaded the table beside the garden.`,
      `He carried the ${word} as they walked along the sunny path.`
    ];
    if(/jewel|jewelry|necklace|chain|ornament|gem/.test(d)) return [
      `She wore the ${word} on a thin silver chain.`,
      `The ${word} caught the light as she turned.`,
      `He placed the ${word} carefully inside the jewelry box.`
    ];
    if(/person|man|woman|child|worker|leader|official/.test(d)) return [
      `The ${word} entered the room just before the meeting began.`,
      `Everyone turned toward the ${word} when the announcement was made.`,
      `She spoke briefly with the ${word} after the event.`
    ];
    if(/object|tool|device|instrument|container|piece|item/.test(d)) return [
      `She picked up the ${word} and examined it closely.`,
      `The ${word} was lying on the table near the window.`,
      `He packed the ${word} carefully before leaving.`
    ];
    return [
      `The ${word} appeared several times in the chapter.`,
      `She paused to look more closely at the ${word}.`,
      `The ${word} became an important detail in the scene.`
    ];
  }

  if(p.includes('verb')){
    return [
      `She decided to ${word} before anyone else arrived.`,
      `He watched them ${word} and tried to understand why.`,
      `They continued to ${word} until the task was finished.`
    ];
  }

  if(p.includes('adjective')){
    if(/curve|winding|twist|bend|meander/.test(d)) return [
      `The ${word} road curved through the hills.`,
      `A ${word} river wound across the valley floor.`,
      `They followed a ${word} path through the forest.`
    ];
    if(/quiet|subtle|not noticeable|unobtrusive|discreet/.test(d)) return [
      `She chose a ${word} place near the back of the room.`,
      `The design was simple and ${word}.`,
      `His ${word} manner allowed him to blend into the crowd.`
    ];
    return [
      `The author described the scene as ${word}.`,
      `Her ${word} expression immediately caught his attention.`,
      `The room had a distinctly ${word} atmosphere.`
    ];
  }

  if(p.includes('adverb')){
    if(/not noticeable|unobtrusive|discreet|quiet|subtle/.test(d)) return [
      `She unobtrusively slipped into the back row.`,
      `The waiter unobtrusively cleared the empty glasses.`,
      `He unobtrusively observed the conversation from the corner.`
    ].map(s=>s.replace(/unobtrusively/g,word));
    return [
      `She moved ${word} through the room without interrupting anyone.`,
      `He ${word} placed the note on the desk.`,
      `The change happened ${word}, almost without anyone noticing.`
    ];
  }

  return [
    `The word “${word}” appeared naturally in the passage.`,
    `Seeing “${word}” in context made its meaning clearer.`,
    `The sentence used “${word}” in a way that matched its definition.`
  ];
}

function parseDatamuseDefinition(item, word){
  if(!item || !Array.isArray(item.defs) || !item.defs.length) return null;
  const first=item.defs[0]||'';
  const tab=first.indexOf('\t');
  const tag=tab>=0?first.slice(0,tab):'';
  const definition=cleanDefinition(tab>=0?first.slice(tab+1):first);
  const posMap={n:'noun',v:'verb',adj:'adjective',adv:'adverb',u:'unknown'};
  const partOfSpeech=posMap[tag]||tag||((item.tags||[]).find(t=>['n','v','adj','adv'].includes(t))||'');
  const pron=(item.tags||[]).find(t=>t.startsWith('pron:'));
  let phonetic=pron?pron.slice(5).trim():'';
  if (/\d/.test(phonetic) || (/^[A-Z\s]+$/.test(phonetic) && phonetic.includes(' '))) phonetic='';
  return {word,partOfSpeech:posMap[partOfSpeech]||partOfSpeech,phonetic,definition,examples:[]};
}

function isInflectionOnlyDefinition(text){
  const s=String(text||'').toLowerCase().trim();
  return /^(?:the )?(?:present participle(?: and gerund)?|gerund|past participle|simple past(?: tense)?|third-person singular simple present|plural|comparative|superlative) (?:form )?of\b/.test(s);
}

function inflectionLemmaCandidates(word,definition){
  const out=[];
  const m=String(definition||'').match(/\bof\s+([a-z][a-z'-]*)\b/i);
  if(m) out.push(m[1].toLowerCase());
  if(word.endsWith('ing')){
    const base=word.slice(0,-3); out.push(base,base+'e');
    if(base.length>2 && base.at(-1)===base.at(-2)) out.push(base.slice(0,-1));
  }else if(word.endsWith('ied')) out.push(word.slice(0,-3)+'y');
  else if(word.endsWith('ed')) out.push(word.slice(0,-2),word.slice(0,-1));
  else if(word.endsWith('ies')) out.push(word.slice(0,-3)+'y');
  else if(word.endsWith('es')) out.push(word.slice(0,-2),word.slice(0,-1));
  else if(word.endsWith('s')) out.push(word.slice(0,-1));
  return [...new Set(out.filter(x=>x && x!==word))];
}

async function resolveInflectedMeaning(word,entry){
  if(!entry || !isInflectionOnlyDefinition(entry.definition)) return entry;
  for(const lemma of inflectionLemmaCandidates(word,entry.definition)){
    try{
      const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lemma)}`);
      if(!r.ok) continue;
      const data=await r.json();
      const base=pickBestDictionarySense(data,lemma);
      if(!base || !base.definition || isInflectionOnlyDefinition(base.definition)) continue;
      const pos=(entry.partOfSpeech||base.partOfSpeech||'').toLowerCase();
      let def=base.definition.replace(/[.;]+$/,'');
      if(word.endsWith('ing')){
        if(pos.includes('verb')) def=`The act of ${def.charAt(0).toLowerCase()+def.slice(1)}`;
        else def=def.charAt(0).toUpperCase()+def.slice(1);
      }
      return {...entry,partOfSpeech:entry.partOfSpeech||base.partOfSpeech,definition:def+'.',examples:[]};
    }catch(e){}
  }
  return entry;
}

async function lookupWord(raw){
  const word=normalize(raw); if(!word) return;
  $('#wordInput').value=word; setStatus('Looking it up…'); $('#result').classList.remove('show');
  let entry=null;

  // Source 1: Free Dictionary API — usually provides the richest definitions/examples.
  try{
    const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(r.ok){
      const data=await r.json();
      entry=pickBestDictionarySense(data,word);
    }
  }catch(e){}

  // Source 2: Wiktionary — broad literary coverage and genuine usage examples.
  if(!entry || (entry.examples||[]).length<3){
    const wiki=await fetchWiktionaryEntry(word);
    if(wiki){
      if(!entry) entry=wiki;
      else{
        const merged=[...(entry.examples||[]),...(wiki.examples||[])].filter(Boolean);
        entry.examples=[...new Set(merged)].slice(0,3);
        if(!entry.definition) entry.definition=wiki.definition;
        if(!entry.partOfSpeech) entry.partOfSpeech=wiki.partOfSpeech;
      }
    }
  }

  // Source 2b: Wiktionary page examples via MediaWiki's CORS-enabled Action API.
  if(entry && (entry.examples||[]).length<3){
    const pageExamples=await fetchWiktionaryPageExamples(word);
    entry.examples=[...new Set([...(entry.examples||[]),...pageExamples])].slice(0,3);
  }

  // Source 3: Datamuse/WordNet metadata. This catches many literary or less-common words
  // that the first dictionaries do not return.
  if(!entry){
    try{
      const r=await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=dpr&max=10`);
      if(r.ok){
        const data=await r.json();
        const exact=(data||[]).find(x=>String(x.word||'').toLowerCase()===word && Array.isArray(x.defs) && x.defs.length);
        entry=parseDatamuseDefinition(exact,word);
      }
    }catch(e){}
  }

  // Source 4: small on-device safety net for known test/literary words.
  if(!entry && fallback[word]) entry={word,...fallback[word]};

  if(!entry){
    setStatus('I couldn’t verify that word with the available dictionaries. Check the spelling or try again.');
    return;
  }

  // For words whose public-dictionary first sense is unusually technical, prefer a clearer everyday sense.
  if(qualityOverrides[word]){
    const q=qualityOverrides[word];
    entry={...entry,...q,phonetic:entry.phonetic||'',examples:q.examples};
  }

  entry=await resolveInflectedMeaning(word,entry);
  entry.definition=cleanDefinition(entry.definition);
  entry.examples=(Array.isArray(entry.examples)?entry.examples:[])
    .map(x=>usefulExample(x,word)).filter(Boolean);
  if(entry.examples.length<3){
    const pageExamples=await fetchWiktionaryPageExamples(word);
    entry.examples=[...new Set([...entry.examples,...pageExamples])].slice(0,3);
  }
  entry=repairExamples(entry);
  current=entry;
  saveCurrent();
  setStatus('');
  showResult(entry);
}

function exampleHtml(sentence,word){
  const safeSentence=escapeHtml(sentence);
  const safeWord=escapeHtml(word);
  const escapedWord=safeWord.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const rx=new RegExp(`\\b(${escapedWord})\\b`,'gi');
  return safeSentence.replace(rx,'<span class="exampleWord">$1</span>');
}
function showResult(e){
  $('#resWord').textContent=title(e.word); $('#resMeta').textContent=[e.partOfSpeech,e.phonetic].filter(Boolean).join(' · ');
  $('#resDefinition').textContent=e.definition;
  const ex=e.examples.map(x=>`<li>${exampleHtml(x,e.word)}</li>`).join('');
  $('#resExamples').innerHTML=ex;
  const saved=words.find(x=>x.word===e.word); $('#resStar').textContent=saved?.favorite?'★':'☆'; $('#resStar').classList.toggle('on',!!saved?.favorite);
  $('#saveBtn').textContent='✓ Saved automatically'; $('#result').classList.add('show');
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function saveCurrent(){
  if(!current)return;
  const now=Date.now();
  const idx=words.findIndex(x=>x.word===current.word);
  if(idx>=0){
    const old=words[idx];
    words.splice(idx,1);
    words.unshift({...current,favorite:!!old.favorite,added:old.added||now,lastViewed:now});
  }else{
    words.unshift({...current,favorite:false,added:now,lastViewed:now});
  }
  saveStore();
}
function toggleFavorite(word){const x=words.find(w=>w.word===word); if(x){x.favorite=!x.favorite;saveStore(); if(current?.word===word)showResult(current);}}
function renderRecent(list=words.slice(0,6)){
  const el=$('#recentList'); if(!list.length){el.innerHTML='<div class="empty">Your saved words will appear here.</div>';return;}
  el.innerHTML=list.map((w,i)=>`<div class="item" data-word="${escapeHtml(w.word)}"><div class="tile">${['📚','📝','💡','🔤'][i%4]}</div><div><h3>${escapeHtml(title(w.word))}</h3><p>${escapeHtml(w.definition)}</p></div><button class="star ${w.favorite?'on':''}" data-star="${escapeHtml(w.word)}">${w.favorite?'★':'☆'}</button></div>`).join('');
}

$('#lookupBtn').onclick=()=>lookupWord($('#wordInput').value);
$('#wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')lookupWord(e.target.value)});
$('#resStar').onclick=()=>{if(!current)return; saveCurrent(); toggleFavorite(current.word)};
$('#speakBtn').onclick=()=>{if(current && 'speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(current.word));}};
$('#recentList').onclick=e=>{const star=e.target.closest('[data-star]'); if(star){e.stopPropagation();toggleFavorite(star.dataset.star);return;} const item=e.target.closest('[data-word]'); if(item){const w=words.find(x=>x.word===item.dataset.word); if(w){repairExamples(w);current=w;saveStore();showResult(w);window.scrollTo({top:0,behavior:'smooth'})}}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();
  rec.lang='en-US';
  rec.interimResults=false;
  rec.maxAlternatives=3;
  rec.continuous=false;
  let listening=false;

  function stopListening(){
    listening=false;
    $('#micBtn').classList.remove('listening');
    try{rec.stop()}catch(e){}
  }

  $('#micBtn').onclick=()=>{
    if(listening){ stopListening(); return; }
    listening=true;
    setStatus('Listening…');
    $('#micBtn').classList.add('listening');
    try{rec.start()}catch(e){
      listening=false;
      $('#micBtn').classList.remove('listening');
    }
  };

  rec.onresult=e=>{
    const heard=e.results?.[0]?.[0]?.transcript?.trim().split(/\s+/)[0]||'';
    stopListening();
    if(!heard) return;
    $('#wordInput').value=heard;
    setStatus(`I heard: “${heard}”`);
    setTimeout(()=>lookupWord(heard),150);
  };

  rec.onspeechend=stopListening;
  rec.onnomatch=()=>{stopListening();setStatus('I couldn’t hear that clearly. Try again or type the word.');};
  rec.onerror=()=>{stopListening();setStatus('I couldn’t hear that clearly. Try again or type the word.');};
  rec.onend=()=>{listening=false;$('#micBtn').classList.remove('listening');};
}else{$('#micBtn').onclick=()=>setStatus('Voice entry is not supported by this browser. You can still type the word below.');}

function openModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('show')}
$('#closeModal').onclick=()=>$('#modal').classList.remove('show'); $('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
$('#viewAllBtn').onclick=()=>showWords('All Saved Words',words);
function showWords(titleText,list){
  openModal(`<h2>${titleText}</h2>${list.length?list.map(w=>`<div class="item modalWordItem" style="margin:10px 0" data-modal-word="${escapeHtml(w.word)}"><div class="tile">📘</div><div style="min-width:0;flex:1"><h3>${escapeHtml(title(w.word))}</h3><p>${escapeHtml(w.definition)}</p></div><button class="star ${w.favorite?'on':''}" data-modal-star="${escapeHtml(w.word)}" aria-label="Favorite">${w.favorite?'★':'☆'}</button><button class="deleteWord" data-delete-word="${escapeHtml(w.word)}" aria-label="Delete ${escapeHtml(w.word)}">🗑️ Delete</button></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}`);
};

$('#modalContent').addEventListener('click',e=>{
  const fav=e.target.closest('[data-modal-star]');
  if(fav){
    const word=fav.dataset.modalStar;
    toggleFavorite(word);
    const heading=$('#modalContent h2')?.textContent||'My Words';
    const list=heading==='Favorites'?words.filter(w=>w.favorite):words;
    showWords(heading,list);
    return;
  }

  const del=e.target.closest('[data-delete-word]');
  if(del){
    const word=del.dataset.deleteWord;
    if(confirm(`Delete “${title(word)}” from My Words?`)){
      words=words.filter(w=>w.word!==word);
      if(current?.word===word){
        current=null;
        $('#result').classList.remove('show');
      }
      saveStore();
      const heading=$('#modalContent h2')?.textContent||'My Words';
      const list=heading==='Favorites'?words.filter(w=>w.favorite):words;
      showWords(heading,list);
    }
  }
});

$('.bottom').addEventListener('click',e=>{
  const b=e.target.closest('.navbtn');
  if(!b) return;

  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');

  if(b.dataset.view==='home'){
    $('#modal').classList.remove('show');
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if(b.dataset.view==='words'){
    showWords('My Words',words);
    return;
  }
  if(b.dataset.view==='favorites'){
    showWords('Favorites',words.filter(w=>w.favorite));
    return;
  }
  if(b.dataset.view==='quiz'){
    startQuiz();
  }
});

let quizState=null;

function shuffled(arr){
  return [...arr].sort(()=>Math.random()-.5);
}
function blankWord(sentence,word){
  const esc=word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const rx=new RegExp(`\\b${esc}(?:s|es|ed|ing)?\\b`,'i');
  const out=String(sentence||'').replace(rx,'_____');
  return out===sentence?'_____ '+sentence:out;
}
function buildQuizQuestions(){
  const pool=shuffled(words);
  const count=Math.min(7,Math.max(5,pool.length));
  const qs=[];
  for(let i=0;i<count;i++){
    const target=pool[i%pool.length];
    const others=shuffled(words.filter(w=>w.word!==target.word)).slice(0,3);
    while(others.length<3) others.push(pool[(i+others.length+1)%pool.length]);
    const type=i%4;
    if(type===0 && target.examples?.length){
      const correctSentence=blankWord(target.examples[0],target.word);
      const distractors=others.map(o=>{const ex=(o.examples||[])[0];return ex?blankWord(ex,o.word):`The _____ did not match the meaning in this context.`});
      qs.push({challenge:'Fill the Gap',prompt:`Which sentence is the best fit for “${title(target.word)}”?`,options:shuffled([{value:correctSentence,correct:true},...distractors.map(value=>({value,correct:false}))]),explanation:`“${title(target.word)}” means ${target.definition.charAt(0).toLowerCase()+target.definition.slice(1)}`});
    }else if(type===1){
      qs.push({challenge:'Definition Dash',prompt:`What does “${title(target.word)}” mean?`,options:shuffled([{value:target.definition,correct:true},...others.map(o=>({value:o.definition,correct:false}))]),explanation:target.definition});
    }else if(type===2){
      qs.push({challenge:'Word Detective',prompt:`Which word matches this meaning?\n\n${target.definition}`,options:shuffled([{value:title(target.word),correct:true},...others.map(o=>({value:title(o.word),correct:false}))]),explanation:`The word is “${title(target.word)}.”`});
    }else{
      const good=(target.examples||[])[0];
      if(good){
        const wrongs=others.map(o=>{const ex=(o.examples||[])[0]; return ex?ex.replace(new RegExp(`\\b${o.word}\\b`,'i'),target.word):`The ${target.word} was unrelated to the meaning being tested.`});
        qs.push({challenge:'Usage Challenge',prompt:`Which sentence uses “${title(target.word)}” correctly?`,options:shuffled([{value:good,correct:true},...wrongs.map(value=>({value,correct:false}))]),explanation:`The correct sentence uses “${title(target.word)}” in the sense: ${target.definition}`});
      }else i--;
    }
  }
  return qs.slice(0,count);
}
function startQuiz(){
  if(words.length<2){
    openModal('<h2>Quiz Me</h2><div class="empty">Save at least 2 words first, then I can quiz you.</div>');
    return;
  }
  quizState={questions:buildQuizQuestions(),index:0,score:0,streak:0,bestStreak:0,xp:0,answered:false};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q=quizState.questions[quizState.index];
  const total=quizState.questions.length;
  const pct=(quizState.index/total)*100;
  openModal(`
    <h2>Quiz Me</h2>
    <div class="quizCount">Question ${quizState.index+1} of ${total}</div>
    <div class="quizHud"><span class="quizChip">🔥 Streak: ${quizState.streak}</span><span class="quizChip">✨ ${quizState.xp} XP</span></div>
    <div class="quizProgress"><div class="quizProgressBar" style="width:${pct}%"></div></div>
    <div class="quizChallenge">${escapeHtml(q.challenge||'Challenge')}</div>
    <div class="quizPrompt">${escapeHtml(q.prompt).replace(/\n/g,'<br>')}</div>
    <div class="quizChoices">
      ${q.options.map((o,j)=>`<button class="quizChoice" data-quiz-choice="${j}">${escapeHtml(o.value)}</button>`).join('')}
    </div>
    <div id="quizFeedback"></div>
  `);

  document.querySelectorAll('[data-quiz-choice]').forEach(btn=>{
    btn.onclick=()=>answerQuiz(Number(btn.dataset.quizChoice));
  });
}

function answerQuiz(choiceIndex){
  if(quizState.answered)return;
  quizState.answered=true;
  const q=quizState.questions[quizState.index];
  const picked=q.options[choiceIndex];
  if(picked.correct){quizState.score++;quizState.streak++;quizState.xp+=10;quizState.bestStreak=Math.max(quizState.bestStreak,quizState.streak);}else{quizState.streak=0;}

  document.querySelectorAll('[data-quiz-choice]').forEach((btn,j)=>{
    btn.disabled=true;
    if(q.options[j].correct) btn.classList.add('correct');
    else if(j===choiceIndex) btn.classList.add('wrong');
  });

  $('#quizFeedback').innerHTML=`
    <div class="quizFeedback">${picked.correct?'✅ Nice!':'Not quite.'} ${escapeHtml(q.explanation)}</div>
    <button class="quizNext" id="quizNextBtn">${quizState.index===quizState.questions.length-1?'See my score':'Next question →'}</button>
  `;
  $('#quizNextBtn').onclick=nextQuizQuestion;
}

function nextQuizQuestion(){
  if(quizState.index>=quizState.questions.length-1){
    const total=quizState.questions.length;
    const score=quizState.score;
    const msg=score===total?'Excellent — you nailed every one.':score>=Math.ceil(total*.7)?'Nice work — these words are starting to stick.':'Good practice — another round will help reinforce them.';
    openModal(`
      <h2>Quiz Complete</h2>
      <div class="quizScore">
        <div class="quizScoreBig">${score}/${total}</div>
        <p>${msg}</p><p><b>✨ ${quizState.xp} XP</b> &nbsp; • &nbsp; Best streak 🔥 ${quizState.bestStreak}</p>
        <button class="quizNext" id="quizAgainBtn">Play another round</button>
      </div>
    `);
    $('#quizAgainBtn').onclick=startQuiz;
    return;
  }
  quizState.index++;
  quizState.answered=false;
  renderQuizQuestion();
}
$('#clearBtn').onclick=()=>openModal(`<h2>Settings</h2><p class="small">Your saved words live only in this browser using local storage.</p><p class="small"><b>Microphone:</b> My Words only turns the microphone on after you tap the purple mic. iPhone controls whether permission is remembered between sessions.</p><button class="pill" id="clearAll">Clear all saved words</button>`);
document.addEventListener('click',e=>{if(e.target?.id==='clearAll'){if(confirm('Clear all saved words?')){words=[];saveStore();$('#modal').classList.remove('show');$('#result').classList.remove('show')}}});


// One-time cleanup for words saved by earlier versions.
// Removes leaked Wiki markup and the repetitive placeholder examples used before v1.6.
(function migrateOldSavedWords(){
  let changed=false;
  words=words.map(w=>{
    const next={...w};
    const cleaned=cleanDefinition(next.definition||'');
    if(cleaned!==next.definition){next.definition=cleaned;changed=true;}
    if(Array.isArray(next.examples)){
      const before=next.examples.length;
      next.examples=next.examples.filter(s=>{
        const t=String(s||'');
        return !/^The author used [“"]/.test(t) &&
               !/^After learning [“"]/.test(t) &&
               !/^Using [“"]/.test(t) &&
               !/^She noticed the .+ immediately\.$/i.test(t) &&
               !/^The .+ became an important part of the scene\.$/i.test(t) &&
               !/^They talked about the .+ later that evening\.$/i.test(t);
      });
      if(next.examples.length!==before) changed=true;
    }
    return next;
  });
  if(changed) localStorage.setItem(storeKey,JSON.stringify(words));
})();

words=words.map(w=>repairExamples(w));
localStorage.setItem(storeKey,JSON.stringify(words));
renderRecent();
</script>
